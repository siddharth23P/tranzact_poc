# Phase 1 topology: infra (redis, minio, postgres) + api (migrations + health)
# + placeholder worker and mock-erp so the full locked topology is present.
# Later phases flesh out worker (Puppeteer render) and mock-erp (entity CRUD).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pdf_service}
      POSTGRES_USER: ${POSTGRES_USER:-pdf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pdf}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pdf} -d ${POSTGRES_DB:-pdf_service}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      # Browsers fetch presigned artifact/archive URLs directly from the bucket,
      # so the S3 API must answer CORS preflights for the app's origin(s).
      # Comma-separated list; '*' for local dev. See docs/api.md.
      MINIO_API_CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-*}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the artifacts bucket once MinIO is up (used from phase 2 onward).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local ${S3_ENDPOINT:-http://minio:9000} ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-pdf-artifacts} &&
      echo 'bucket ready';
      "

  api:
    build:
      context: ./pdf-service
    command: ["node", "src/server.js"]
    env_file:
      - .env
    environment:
      SERVICE_ROLE: api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "3000:3000"

  # Render worker: BrowserPool (warm Chromium) + SinglePass render + SHA-256 +
  # manifest write + presigned URL. Shares the api image (which bundles Chromium).
  worker:
    build:
      context: ./pdf-service
    command: ["node", "src/worker.js"]
    env_file:
      - .env
    environment:
      SERVICE_ROLE: worker
    # Chromium is happier with more /dev/shm, though we also pass
    # --disable-dev-shm-usage as a belt-and-suspenders.
    shm_size: "1gb"
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Placeholder until phase 6 (entity CRUD + fixtures generator).
  mock-erp:
    build:
      context: ./mock-erp
    command: ["node", "src/server.js"]
    environment:
      MOCK_ERP_PORT: 4000
    ports:
      - "4000:4000"

volumes:
  pgdata:
  redisdata:
  miniodata:
